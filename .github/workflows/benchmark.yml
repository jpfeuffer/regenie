name: BGEN Benchmark

# Runs a step-2 GWAS throughput benchmark against a synthetic ~20 MB BGEN file
# (100 000 variants × 500 samples) generated by concatenating the committed
# example/example_3chr.bgen 200 times with cat-bgen.
#
# Dependencies are installed from conda-forge via micromamba:
#   bgen v1.2.0 (built from source), aws-sdk-cpp, cxxopts, boost, zlib, zstd, sqlite
#
# Timing and throughput are uploaded as a job artifact for trend analysis.

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      reps:
        description: >
          Repetitions of example_3chr.bgen (500 vars each).
          200 → 100 000 variants, ~20 MB.
        required: false
        default: '200'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    name: Step-2 BGEN benchmark

    env:
      BGEN_VERSION: v1.2.0
      BGEN_REPO: https://github.com/gavinband/bgen.git
      BENCH_REPS: ${{ github.event.inputs.reps || '200' }}
      DEPS_DIR: ${{ github.workspace }}/deps

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── conda-forge dependencies via micromamba ────────────────────────────
      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          micromamba-version: latest
          init-shell: bash
          generate-run-shell: true
          post-cleanup: none
          environment-name: regenie-bench
          create-args: >-
            -c conda-forge
            cmake>=3.25
            ninja
            gfortran
            boost-cpp>=1.84
            zlib
            zstd
            sqlite
            aws-sdk-cpp
            cxxopts
            openssl
            libcurl

      # ── bgen v1.2.0 (cmake-based, built from source) ──────────────────────
      - name: Cache bgen install
        id: bgen-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.DEPS_DIR }}/bgen
          key: bgen-${{ runner.os }}-${{ env.BGEN_VERSION }}-${{ env.CONDA_PREFIX }}

      - name: Build and install bgen
        if: steps.bgen-cache.outputs.cache-hit != 'true'
        shell: bash -el {0}
        run: |
          git clone --depth 1 --branch ${{ env.BGEN_VERSION }} \
            ${{ env.BGEN_REPO }} bgen-src
          cmake -B bgen-src/build bgen-src \
            -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${{ env.DEPS_DIR }}/bgen \
            -DCMAKE_PREFIX_PATH="$CONDA_PREFIX" \
            -DBGEN_BUILD_TESTS=OFF \
            -DBGEN_BUILD_EXAMPLES=OFF \
            -DBGEN_BUILD_TOOLS=ON \
            -DBGEN_WITH_S3=OFF
          cmake --build bgen-src/build
          cmake --install bgen-src/build

      # ── regenie ────────────────────────────────────────────────────────────
      - name: Build regenie
        shell: bash -el {0}
        run: |
          cmake -B regenie-build . \
            -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ env.DEPS_DIR }}/bgen;$CONDA_PREFIX" \
            -DWITH_AWS_S3=ON \
            -DBUILD_STATIC=OFF
          cmake --build regenie-build
          regenie-build/bin/regenie --version

      # ── benchmark data ─────────────────────────────────────────────────────
      - name: Cache benchmark BGEN
        id: bench-bgen-cache
        uses: actions/cache@v4
        with:
          path: benchmark_data/
          key: bench-bgen-v1-reps${{ env.BENCH_REPS }}-${{ hashFiles('example/example_3chr.bgen') }}

      - name: Generate benchmark BGEN
        if: steps.bench-bgen-cache.outputs.cache-hit != 'true'
        run: |
          bash scripts/create_benchmark_bgen.sh \
            --bgen-tools-dir ${{ env.DEPS_DIR }}/bgen/bin \
            --reps           ${{ env.BENCH_REPS }} \
            --outdir         benchmark_data

      # ── run benchmark ──────────────────────────────────────────────────────
      - name: Run step-2 BGEN benchmark
        run: |
          bash test/benchmark.sh \
            --regenie regenie-build/bin/regenie \
            --datadir benchmark_data

      - name: Show benchmark summary
        if: always()
        run: |
          echo "=== benchmark_timing.txt ==="
          cat benchmark_data/benchmark_timing.txt 2>/dev/null || echo "(no timing file)"

      # ── artifacts ──────────────────────────────────────────────────────────
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: |
            benchmark_data/benchmark_timing.txt
            benchmark_data/benchmark_time_verbose.txt
          retention-days: 90
