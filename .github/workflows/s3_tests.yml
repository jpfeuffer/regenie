name: S3 integration

# Exercises the s3:// input path end to end against a local MinIO server, on all
# three platforms.
#
# MinIO comes from conda-forge rather than a container or a download:
#   - GitHub's macOS and Windows runners cannot run Linux containers
#   - dl.min.io no longer serves standalone binaries
#   - conda-forge's minio-server has linux-64, osx-64 and win-64 builds
#
# There is no minio-mc for win-64, so no client tool is used at all: MinIO treats
# each top-level directory under its data dir as a bucket, so the fixtures are
# staged with mkdir/cp before the server starts.
#
# Server start, test and teardown share a single step on purpose. GitHub reaps
# the process tree at the end of each step on Windows, so a server backgrounded
# in one step is gone by the next.

on:
  push:
    branches: [master, modernize-build]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  s3:
    name: "S3 (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
      run:
        shell: bash -el {0}

    env:
      BGEN_TAG: v4.10.1
      MINIO_PORT: 19000
      BUCKET: regenie-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          micromamba-version: latest
          init-shell: bash
          environment-name: regenie-s3
          create-args: >-
            -c conda-forge
            cmake
            ninja
            cxx-compiler
            c-compiler
            minio-server
            curl
            libcurl
            zlib
            zstd
            zlib-ng
            boost-cpp
            eigen
            cxxopts
            libdeflate
            sqlite

      # bgen-limix >= 4.7 is needed for bgen_file_layout/compression/nbits and
      # BGEN::s3. conda-forge's bgen is still on the older 4.1.x line. >= 4.9
      # drops its athr (progress-bar) dependency entirely, which used to need
      # -DBGEN_USE_SYSTEM_ATHR=OFF here since athr was never in create-args
      # above and conda-forge's copy also hardcoded an Xcode SDK path.
      - name: Show compiler environment (Windows diagnostics)
        if: runner.os == 'Windows'
        run: |
          echo "CC=$CC"
          echo "CXX=$CXX"
          which cl 2>/dev/null || echo "cl not on PATH"
          which cc 2>/dev/null || echo "cc not on PATH"
          echo "PATH=$PATH"

      # CMake's plain cc/c++ search finds the runner image's preinstalled
      # C:\mingw64 ahead of the conda env's MSVC (from the c-compiler/
      # cxx-compiler packages above), since both provide a generically-named
      # compiler. Pinning to $CC/$CXX -- set by conda's own vs2019_win-64/
      # vs2022_win-64 activation scripts to cl.exe's full path -- picks the
      # one that actually matches this dependency chain; a bare "cl" would
      # discard that path and fail the same PATH search a second time.
      - name: Build and install bgen-limix
        run: |
          extra_args=()
          if [ "$RUNNER_OS" = "Windows" ] && [ -n "$CC" ]; then
            extra_args+=(-DCMAKE_C_COMPILER="$CC" -DCMAKE_CXX_COMPILER="$CXX")
          fi
          git clone --depth 1 --branch "$BGEN_TAG" \
            https://github.com/jpfeuffer/bgen-limix.git "$RUNNER_TEMP/bgen"
          cmake -S "$RUNNER_TEMP/bgen" -B "$RUNNER_TEMP/bgen/build" -G Ninja \
            "${extra_args[@]}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$CONDA_PREFIX" \
            -DBGEN_BUILD_TESTS=OFF \
            -DBGEN_ENABLE_S3=ON
          cmake --build "$RUNNER_TEMP/bgen/build"
          cmake --install "$RUNNER_TEMP/bgen/build"

      - name: Configure and build regenie
        run: |
          extra_args=()
          if [ "$RUNNER_OS" = "Windows" ] && [ -n "$CC" ]; then
            extra_args+=(-DCMAKE_C_COMPILER="$CC" -DCMAKE_CXX_COMPILER="$CXX")
          fi
          cmake -S . -B build -G Ninja \
            "${extra_args[@]}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$CONDA_PREFIX" \
            -DWITH_S3=ON
          cmake --build build

      - name: Confirm S3 support is compiled in
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ls build/bin/
          elif [ "$RUNNER_OS" = "macOS" ]; then
            otool -L build/bin/regenie | grep -i curl
          else
            ldd build/bin/regenie | grep -i curl
          fi

      # Everything below runs in ONE step so the server survives on Windows.
      - name: Run regenie against MinIO
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
          # lets MinIO accept virtual-hosted-style requests as well as path-style
          MINIO_DOMAIN: localhost
        run: |
          set -euo pipefail
          export AWS_ENDPOINT_URL="http://127.0.0.1:${MINIO_PORT}"

          # stage fixtures as a bucket: a top-level dir under the data dir
          mkdir -p "$RUNNER_TEMP/minio-data/$BUCKET"
          cp example/example_3chr.bgen   "$RUNNER_TEMP/minio-data/$BUCKET/"
          cp example/example_3chr.sample "$RUNNER_TEMP/minio-data/$BUCKET/"

          minio server "$RUNNER_TEMP/minio-data" \
            --address ":${MINIO_PORT}" > "$RUNNER_TEMP/minio.log" 2>&1 &
          MINIO_PID=$!
          trap 'kill "$MINIO_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 60); do
            if curl -sf "$AWS_ENDPOINT_URL/minio/health/live" > /dev/null; then break; fi
            sleep 1
          done
          curl -sf "$AWS_ENDPOINT_URL/minio/health/live" > /dev/null \
            || { echo "MinIO did not come up"; cat "$RUNNER_TEMP/minio.log"; exit 1; }

          common=(--step 2 --ignore-pred --bt
                  --phenoFile example/phenotype_bin.txt
                  --covarFile example/covariates.txt
                  --bsize 100)

          # Reference run on local input; this also builds the index, which is
          # then published alongside the object so the remote run finds it.
          ./build/bin/regenie "${common[@]}" \
            --bgen example/example_3chr.bgen \
            --sample example/example_3chr.sample \
            --out "$RUNNER_TEMP/local"

          # A remote BGEN with no index must fail rather than silently pulling
          # the whole object over the network.
          if ./build/bin/regenie "${common[@]}" \
               --bgen "s3://${BUCKET}/example_3chr.bgen" \
               --sample example/example_3chr.sample \
               --out "$RUNNER_TEMP/noindex" > "$RUNNER_TEMP/noindex.log" 2>&1; then
            echo "expected failure: remote input without an index was accepted"
            exit 1
          fi
          grep -q "no index found for remote file" "$RUNNER_TEMP/noindex.log" \
            || { echo "wrong error for un-indexed remote input:"; cat "$RUNNER_TEMP/noindex.log"; exit 1; }
          echo "un-indexed remote input is refused, as intended"

          # Publish the index alongside the object: the recommended workflow.
          cp example/example_3chr.bgen.metafile "$RUNNER_TEMP/minio-data/$BUCKET/"

          ./build/bin/regenie "${common[@]}" \
            --bgen "s3://${BUCKET}/example_3chr.bgen" \
            --sample example/example_3chr.sample \
            --out "$RUNNER_TEMP/remote"

          grep -v '^##' "$RUNNER_TEMP/local_Y1.regenie"  > "$RUNNER_TEMP/a.txt"
          grep -v '^##' "$RUNNER_TEMP/remote_Y1.regenie" > "$RUNNER_TEMP/b.txt"
          diff "$RUNNER_TEMP/a.txt" "$RUNNER_TEMP/b.txt"
          echo "s3:// results match local input"

      - name: MinIO log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/minio.log" || true
